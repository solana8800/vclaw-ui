<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" font-family="-apple-system, 'Segoe UI', system-ui, sans-serif">
  <!-- Background -->
  <rect width="880" height="540" fill="#f2e9e7"/>

  <!-- Card shadow -->
  <rect x="40" y="40" width="800" height="380" rx="20" fill="#000" opacity="0.05" transform="translate(0,4)"/>

  <!-- Card -->
  <rect x="40" y="40" width="800" height="380" rx="20" fill="#fbf7f5" stroke="#e9d6d3" stroke-width="1"/>

  <!-- Card header -->
  <text x="68" y="80" font-size="18" font-weight="800" fill="#1d1013">VClaw Token</text>
  <text x="68" y="100" font-size="11" fill="#7a5a5e">Track the gateway currently used by admin chat and runtime actions.</text>

  <!-- Refresh button (top-right, highlighted) -->
  <defs>
    <linearGradient id="brandGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D13238"/>
      <stop offset="100%" stop-color="#9B1D3D"/>
    </linearGradient>
  </defs>
  <rect x="724" y="60" width="92" height="32" rx="16" fill="#fff" stroke="#D13238" stroke-width="2"/>
  <circle cx="744" cy="76" r="6" fill="none" stroke="#D13238" stroke-width="1.8"/>
  <path d="M749 73 L753 76 L749 79" fill="none" stroke="#D13238" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="758" y="81" font-size="11" font-weight="800" fill="#B1252A">Refresh</text>

  <!-- Success Banner -->
  <rect x="68" y="120" width="744" height="56" rx="14" fill="#ecfdf5" stroke="#34d399" stroke-width="1.5"/>
  <circle cx="92" cy="148" r="10" fill="#10b981"/>
  <path d="M88 148 L91 151 L97 145" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="112" y="145" font-size="12" font-weight="800" fill="#065f46">VClaw Token connected successfully</text>
  <text x="112" y="161" font-size="11" fill="#047857">Web runtime is active.</text>

  <!-- Readiness pills (all OK) -->
  <g transform="translate(68, 200)">
    <rect x="0" y="0" width="240" height="60" rx="14" fill="#fff" stroke="#34d399" stroke-width="1.5"/>
    <text x="16" y="20" font-size="9" font-weight="800" fill="#7a5a5e" letter-spacing="1.5">WEB CATALOG</text>
    <text x="16" y="42" font-size="16" font-weight="800" fill="#065f46">OK</text>
    <circle cx="220" cy="30" r="8" fill="#10b981"/>
    <path d="M216 30 L219 33 L224 27" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="252" y="0" width="240" height="60" rx="14" fill="#fff" stroke="#34d399" stroke-width="1.5"/>
    <text x="268" y="20" font-size="9" font-weight="800" fill="#7a5a5e" letter-spacing="1.5">WEB AUTH</text>
    <text x="268" y="42" font-size="16" font-weight="800" fill="#065f46">OK</text>
    <circle cx="472" cy="30" r="8" fill="#10b981"/>
    <path d="M468 30 L471 33 L476 27" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="504" y="0" width="240" height="60" rx="14" fill="#fff" stroke="#34d399" stroke-width="1.5"/>
    <text x="520" y="20" font-size="9" font-weight="800" fill="#7a5a5e" letter-spacing="1.5">WEB RUNTIME</text>
    <text x="520" y="42" font-size="16" font-weight="800" fill="#065f46">OK</text>
    <circle cx="724" cy="30" r="8" fill="#10b981"/>
    <path d="M720 30 L723 33 L728 27" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Action row: Restart Gateway highlighted -->
  <g transform="translate(68, 300)">
    <rect x="0" y="0" width="360" height="44" rx="14" fill="#fff" stroke="#e9d6d3" stroke-width="1"/>
    <circle cx="22" cy="22" r="7" fill="none" stroke="#7a5a5e" stroke-width="1.5"/>
    <text x="40" y="27" font-size="11" font-weight="800" fill="#342227">Login with Google</text>

    <!-- Restart Gateway — emphasized -->
    <rect x="384" y="-2" width="360" height="48" rx="16" fill="#fff" stroke="#D13238" stroke-width="2.5"/>
    <rect x="384" y="-2" width="360" height="48" rx="16" fill="none" stroke="#D13238" stroke-width="0.5" opacity="0.3" transform="translate(0,0) scale(1.01)"/>
    <g transform="translate(408, 22)">
      <path d="M-7 -2 a7 7 0 1 0 4 -6" fill="none" stroke="#D13238" stroke-width="2" stroke-linecap="round"/>
      <path d="M-3 -8 L-3 -3 L2 -3" fill="none" stroke="#D13238" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="428" y="28" font-size="12" font-weight="800" fill="#B1252A">Restart Gateway</text>
  </g>

  <!-- Hint -->
  <g transform="translate(560, 280)">
    <path d="M0 0 L18 22" stroke="#D13238" stroke-width="1.5" stroke-dasharray="3,3" fill="none"/>
    <text x="-22" y="-6" font-size="10" font-style="italic" fill="#B1252A">Click here, wait ~3s</text>
  </g>

  <!-- Toast (floating bottom-right) -->
  <g transform="translate(440, 448)">
    <rect x="0" y="0" width="400" height="64" rx="14" fill="#1d1013"/>
    <rect x="0" y="0" width="4" height="64" rx="2" fill="#10b981"/>
    <circle cx="28" cy="32" r="10" fill="#10b981"/>
    <path d="M24 32 L27 35 L33 29" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="50" y="29" font-size="12" font-weight="800" fill="#fff">Gateway restarted successfully!</text>
    <text x="50" y="48" font-size="10" fill="#9ca3af">Status will refresh in 2 seconds…</text>
    <text x="370" y="20" font-size="14" font-weight="800" fill="#6b7280">×</text>
  </g>
</svg>
