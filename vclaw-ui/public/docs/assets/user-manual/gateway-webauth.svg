<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" font-family="-apple-system, 'Segoe UI', system-ui, sans-serif">
  <!-- Background -->
  <rect width="880" height="540" fill="#f2e9e7"/>

  <!-- Card shadow -->
  <rect x="40" y="40" width="800" height="460" rx="20" fill="#000" opacity="0.05" transform="translate(0,4)"/>

  <!-- Card -->
  <rect x="40" y="40" width="800" height="460" rx="20" fill="#fbf7f5" stroke="#e9d6d3" stroke-width="1"/>

  <!-- Card header -->
  <text x="68" y="80" font-size="18" font-weight="800" fill="#1d1013">VClaw Token</text>
  <text x="68" y="100" font-size="11" fill="#7a5a5e">Track the gateway currently used by admin chat and runtime actions.</text>

  <!-- Refresh button (top-right) -->
  <rect x="730" y="62" width="80" height="28" rx="14" fill="#fff" stroke="#e9d6d3" stroke-width="1"/>
  <circle cx="748" cy="76" r="5" fill="none" stroke="#7a5a5e" stroke-width="1.5"/>
  <path d="M752 73 L755 76 L752 79" fill="none" stroke="#7a5a5e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="760" y="80" font-size="11" font-weight="700" fill="#342227">Refresh</text>

  <!-- Success Banner (green) -->
  <rect x="68" y="120" width="744" height="56" rx="14" fill="#ecfdf5" stroke="#34d399" stroke-width="1.5"/>
  <circle cx="92" cy="148" r="10" fill="#10b981"/>
  <path d="M88 148 L91 151 L97 145" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="112" y="145" font-size="12" font-weight="800" fill="#065f46">VClaw Token connected successfully</text>
  <text x="112" y="161" font-size="11" fill="#047857">Web runtime is active — DeepSeek session captured.</text>

  <!-- Readiness pills -->
  <g transform="translate(68, 200)">
    <!-- Web catalog -->
    <rect x="0" y="0" width="240" height="60" rx="14" fill="#fff" stroke="#34d399" stroke-width="1.5"/>
    <text x="16" y="20" font-size="9" font-weight="800" fill="#7a5a5e" letter-spacing="1.5">WEB CATALOG</text>
    <text x="16" y="42" font-size="16" font-weight="800" fill="#065f46">OK</text>
    <circle cx="220" cy="30" r="8" fill="#10b981"/>
    <path d="M216 30 L219 33 L224 27" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Web auth -->
    <rect x="252" y="0" width="240" height="60" rx="14" fill="#fff" stroke="#34d399" stroke-width="1.5"/>
    <text x="268" y="20" font-size="9" font-weight="800" fill="#7a5a5e" letter-spacing="1.5">WEB AUTH</text>
    <text x="268" y="42" font-size="16" font-weight="800" fill="#065f46">OK</text>
    <circle cx="472" cy="30" r="8" fill="#10b981"/>
    <path d="M468 30 L471 33 L476 27" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Web runtime -->
    <rect x="504" y="0" width="240" height="60" rx="14" fill="#fff" stroke="#34d399" stroke-width="1.5"/>
    <text x="520" y="20" font-size="9" font-weight="800" fill="#7a5a5e" letter-spacing="1.5">WEB RUNTIME</text>
    <text x="520" y="42" font-size="16" font-weight="800" fill="#065f46">OK</text>
    <circle cx="724" cy="30" r="8" fill="#10b981"/>
    <path d="M720 30 L723 33 L728 27" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Divider -->
  <line x1="68" y1="290" x2="812" y2="290" stroke="#e9d6d3" stroke-width="1"/>
  <text x="68" y="316" font-size="10" font-weight="800" letter-spacing="1.5" fill="#7a5a5e">CONNECT AI</text>

  <!-- Action grid: 2 rows × 2 cols -->
  <!-- Row 1: Login Google / Restart Gateway (outline) -->
  <g transform="translate(68, 332)">
    <rect x="0" y="0" width="360" height="40" rx="14" fill="#fff" stroke="#e9d6d3" stroke-width="1"/>
    <circle cx="22" cy="20" r="7" fill="none" stroke="#7a5a5e" stroke-width="1.5"/>
    <text x="40" y="25" font-size="11" font-weight="800" fill="#342227">Login with Google</text>

    <rect x="384" y="0" width="360" height="40" rx="14" fill="#fff" stroke="#e9d6d3" stroke-width="1"/>
    <g transform="translate(404, 20)">
      <circle cx="0" cy="0" r="7" fill="none" stroke="#7a5a5e" stroke-width="1.5"/>
      <path d="M4 -3 L7 0 L4 3" fill="none" stroke="#7a5a5e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="424" y="25" font-size="11" font-weight="800" fill="#342227">Restart Gateway</text>
  </g>

  <!-- Row 2: Model dropdown / Activate WebAuth (primary) -->
  <g transform="translate(68, 384)">
    <!-- Dropdown -->
    <rect x="0" y="0" width="360" height="40" rx="14" fill="#fff" stroke="#e9d6d3" stroke-width="1"/>
    <text x="20" y="25" font-size="11" font-weight="800" fill="#342227">DeepSeek</text>
    <path d="M335 17 L342 24 L349 17" stroke="#7a5a5e" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Primary button — gradient red, yellow text -->
    <defs>
      <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#D13238"/>
        <stop offset="100%" stop-color="#9B1D3D"/>
      </linearGradient>
    </defs>
    <rect x="384" y="0" width="360" height="40" rx="14" fill="url(#brandGrad)"/>
    <!-- Sparkles icon -->
    <g transform="translate(410, 20)" stroke="#FFF200" stroke-width="1.8" fill="none" stroke-linecap="round">
      <path d="M0 -7 L0 -2 M0 2 L0 7 M-7 0 L-2 0 M2 0 L7 0"/>
      <path d="M-4 -4 L-2 -2 M2 2 L4 4 M-4 4 L-2 2 M2 -2 L4 -4"/>
    </g>
    <text x="430" y="25" font-size="11" font-weight="800" fill="#FFF200">Activate WebAuth</text>
  </g>

  <!-- Hint pointer -->
  <g transform="translate(540, 462)">
    <path d="M0 0 L20 -25" stroke="#D13238" stroke-width="1.5" stroke-dasharray="3,3" fill="none"/>
    <text x="22" y="-2" font-size="10" font-style="italic" fill="#B1252A">Step 2 → click here</text>
  </g>
</svg>
