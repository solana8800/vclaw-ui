# Cấu hình team agent portable cho Workflow Control
# File này định nghĩa các Agent con tương ứng với các vai trò trong .agents/skills/

[template]
name = "standard-swarm-team"
description = "Nhóm Agent tự động hóa SDLC theo tiêu chuẩn AGENTS.md"
command = ["claude"] # CLI mặc định sẽ chạy
backend = "tmux"     # Chạy trên tmux

[template.leader]
name = "orchestration_agent"
task = "Điều phối quy trình SDLC, theo dõi output của các agent và cập nhật BOARD.md."
command = ["claude", "--prompt", "Bạn là orchestration_agent. Hãy tuân thủ hướng dẫn vận hành trong file .agents/skills/orchestration_agent/SKILL.md"]

[[template.agents]]
name = "product_agent"
task = "Phân tích nghiệp vụ từ BRD, định nghĩa User Story và Acceptance Criteria dạng Given-When-Then trong file 01-product-analysis.md"
command = ["claude", "--prompt", "Bạn là product_agent. Hãy tuân thủ hướng dẫn vận hành trong file .agents/skills/product_agent/SKILL.md"]

[[template.agents]]
name = "designer_agent"
task = "Thiết kế giao diện UI/UX và component contract dựa trên AC trong file 02-design-handoff.md"
command = ["claude", "--prompt", "Bạn là designer_agent. Hãy tuân thủ hướng dẫn vận hành trong file .agents/skills/designer_agent/SKILL.md"]

[[template.agents]]
name = "qc_agent"
task = "Chuyển AC thành test case, thiết kế kịch bản test và viết unit/integration tests xUnit trước khi code backend được phát triển."
command = ["claude", "--prompt", "Bạn là qc_agent. Hãy tuân thủ hướng dẫn vận hành trong file .agents/skills/qc_agent/SKILL.md"]

[[template.agents]]
name = "engineering_agent"
task = "Đọc kịch bản test của QC và viết code logic Clean Architecture backend, đảm bảo toàn bộ tests đều pass."
command = ["claude", "--prompt", "Bạn là engineering_agent. Hãy tuân thủ hướng dẫn vận hành trong file .agents/skills/engineering_agent/SKILL.md"]

[[template.agents]]
name = "security_agent"
task = "Rà soát bảo mật dữ liệu nhạy cảm (PII), SQL Injection, phân quyền và Secrets trước khi hoàn tất code."
command = ["claude", "--prompt", "Bạn là security_agent. Hãy tuân thủ hướng dẫn vận hành trong file .agents/skills/security_agent/SKILL.md"]

[[template.agents]]
name = "devops_agent"
task = "Biên dịch dự án, chạy test suite, kiểm tra lỗ hổng phụ thuộc và cấu hình Docker non-root."
command = ["claude", "--prompt", "Bạn là devops_agent. Hãy tuân thủ hướng dẫn vận hành trong file .agents/skills/devops_agent/SKILL.md"]

[[template.agents]]
name = "release_agent"
task = "Tổng hợp tài liệu phát hành, di trú database, rà soát rủi ro tồn dư và xây dựng rollback plan."
command = ["claude", "--prompt", "Bạn là release_agent. Hãy tuân thủ hướng dẫn vận hành trong file .agents/skills/release_agent/SKILL.md"]
